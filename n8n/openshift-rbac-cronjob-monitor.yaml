# Grants the n8n service account permission to list CronJobs and Jobs
# in the exam calendar project. Apply this in the TARGET namespace
# (where the CronJobs live), not the n8n namespace.
#
#   oc apply -f n8n/openshift-rbac-cronjob-monitor.yaml
#
# Verify:
#   oc auth can-i list cronjobs.batch \
#     --as=system:serviceaccount:oit-sdm-hsit-n8n:n8n-pod-monitor \
#     -n oit-sdm-hsit-examcalendarservice
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: n8n-cronjob-monitor
  namespace: oit-sdm-hsit-examcalendarservice
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: n8n-cronjob-monitor
  namespace: oit-sdm-hsit-examcalendarservice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: n8n-cronjob-monitor
subjects:
  # SA lives in the n8n project; binding is in the CronJob project
  - kind: ServiceAccount
    name: n8n-pod-monitor
    namespace: oit-sdm-hsit-n8n
